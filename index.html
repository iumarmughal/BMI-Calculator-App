<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="wrapper">
      <p>
        Height in CM : <br /><br /><input
          type="text"
          id="height"
        /><br /><br /><span id="height_error"></span>
      </p>
      <p>
        Weight in KG :<br /><br />
        <input type="text" id="weight" /><br /><br />
        <span id="weight_error"></span>
      </p>
      <button id="btn">Calculate</button>
      <br>
      <p id="output"><b></b></p>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
